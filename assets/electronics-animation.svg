<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img" aria-label="Animated electronics schematic">
  <defs>
    <linearGradient id="traceGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="scopeFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- PCB background panel -->
  <rect x="8" y="8" width="704" height="104" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Grid -->
  <g stroke="#21262d" stroke-width="1">
    <path d="M40 24h640M40 48h640M40 72h640M40 96h640"/>
    <path d="M80 20v80M160 20v80M240 20v80M320 20v80M400 20v80M480 20v80M560 20v80M640 20v80"/>
  </g>

  <!-- Static PCB traces -->
  <g fill="none" stroke="#484f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 60 H120 V36 H184"/>
    <path d="M184 36 H248 V84 H312"/>
    <path d="M312 84 H376 V60 H440"/>
    <path d="M440 60 H504 V44 H568"/>
    <path d="M568 44 H632 V76 H664"/>
  </g>

  <!-- Animated signal pulses along traces -->
  <g fill="none" stroke="url(#traceGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
     stroke-dasharray="18 82">
    <path d="M56 60 H120 V36 H184">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M184 36 H248 V84 H312">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M312 84 H376 V60 H440">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M440 60 H504 V44 H568">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M568 44 H632 V76 H664">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- IC / module blocks -->
  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.5">
    <rect x="108" y="48" width="24" height="24" rx="3"/>
    <rect x="236" y="28" width="24" height="24" rx="3"/>
    <rect x="364" y="68" width="24" height="24" rx="3"/>
    <rect x="492" y="32" width="24" height="24" rx="3"/>
    <rect x="620" y="64" width="24" height="24" rx="3"/>
  </g>

  <!-- Blinking status LEDs -->
  <circle cx="120" cy="60" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="248" cy="84" r="4" fill="#f0883e">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="504" cy="44" r="4" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0.35;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Mini oscilloscope -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="112" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="10" y="16" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">CH1</text>
    <path d="M10 58 H102" stroke="#30363d" stroke-width="1"/>
    <path d="M10 58 V22" stroke="#30363d" stroke-width="1"/>
    <path fill="url(#scopeFill)" stroke="#3fb950" stroke-width="2" stroke-linejoin="round"
          d="M10 52 L22 52 30 40 38 52 46 34 54 50 62 44 70 52 78 36 86 48 94 42 102 50">
      <animate attributeName="d"
        values="M10 52 L22 52 30 40 38 52 46 34 54 50 62 44 70 52 78 36 86 48 94 42 102 50;
                M10 50 L22 50 30 46 38 38 46 52 54 40 62 50 70 44 78 52 86 36 94 48 102 42;
                M10 52 L22 52 30 40 38 52 46 34 54 50 62 44 70 52 78 36 86 48 94 42 102 50"
        dur="2.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- CAN bus label -->
  <text x="360" y="18" text-anchor="middle" fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CAN · PWM · HIL</text>
</svg>
